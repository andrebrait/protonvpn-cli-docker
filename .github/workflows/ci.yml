name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint all shell scripts with ShellCheck 0.11.0
        run: git grep -Il '^#!/bin/sh' -- rootfs tests | xargs docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -s sh
      - name: Shell unit tests
        run: sh tests/unit.sh
      - name: WebUI JavaScript parses
        run: |
          node --check rootfs/usr/local/lib/protonvpn-container/protonvpn_container/static/app.js
          node --check rootfs/usr/local/lib/protonvpn-container/protonvpn_container/static/api.js

  smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build test image
        run: docker build --pull -t protonvpn-cli:test .
      - name: Python unit tests in the built image
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          -e PYTHONPATH=/src/rootfs/usr/local/lib/protonvpn-container
          --entrypoint python3 protonvpn-cli:test
          -m unittest discover -s tests/python -t .
      - name: Installed Proton packages are the pinned versions
        run: sh tests/versions.sh protonvpn-cli:test
      - name: Validate the OpenAPI 3.1 document and the API's real responses against it
        run: |
          python3 -m venv "$RUNNER_TEMP/openapi-venv"
          "$RUNNER_TEMP/openapi-venv/bin/pip" install openapi-spec-validator
          "$RUNNER_TEMP/openapi-venv/bin/openapi-spec-validator" rootfs/usr/local/lib/protonvpn-container/protonvpn_container/openapi.json
          PYTHONPATH=rootfs/usr/local/lib/protonvpn-container "$RUNNER_TEMP/openapi-venv/bin/python" -m unittest \
            tests.python.test_api
      - name: Load WireGuard kernel module
        run: sudo modprobe wireguard
      - name: Container smoke tests
        run: IMAGE=protonvpn-cli:test sh tests/smoke.sh

  publish:
    needs: smoke
    if: >-
      github.repository == 'andrebrait/protonvpn-cli-docker' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/andrebrait/protonvpn-cli-docker
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/andrebrait/protonvpn-cli-docker
      - name: Publish both architectures with a fresh base
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Published packages are the pinned versions on both architectures
        env:
          IMAGE: ghcr.io/andrebrait/protonvpn-cli-docker@${{ steps.publish.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            # The runner's classic image store keeps one local image per digest: drop the previous platform's copy first.
            docker image rm "$IMAGE" >/dev/null 2>&1 || true
            sh tests/versions.sh "$IMAGE" "$platform"
          done
